<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>AI 食物熱量辨識 PWA</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0c0d0f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap">
  <style>
    :root {
      --bg: #0a0a0a;
      --panel: #161616;
      --accent: #3b82f6;
      --accent-glow: rgba(59, 130, 246, 0.3);
      --text-dim: #888888;
      --text-bright: #ffffff;
      --success: #22c55e;
      --line: #333333;
      --mono: 'JetBrains Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text-bright);
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* App Shell Grid */
    .app-shell {
      display: grid;
      grid-template-columns: 1fr 320px;
      grid-template-rows: 60px 1fr 100px;
      height: 100vh;
      width: 100vw;
    }

    @media (max-width: 768px) {
      .app-shell {
        grid-template-columns: 1fr;
        grid-template-rows: 60px 1fr 100px;
      }
      aside { display: none; } /* Mobile uses drawer instead */
    }

    /* Header */
    header {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      background: var(--panel);
      border-bottom: 1px solid var(--line);
      z-index: 50;
    }

    .logo {
      font-weight: 800;
      font-size: 14px;
      letter-spacing: 1px;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-bar {
      display: flex;
      gap: 15px;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text-dim);
    }

    .status-item span { color: var(--success); }

    /* Main Viewport */
    main {
      grid-column: 1 / 2;
      position: relative;
      background: #000;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Scan Overlay */
    .scan-overlay {
      position: absolute;
      inset: 20px;
      border: 1px solid rgba(255,255,255,0.05);
      pointer-events: none;
      z-index: 10;
    }

    .crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 40px;
      height: 40px;
    }

    .crosshair::before, .crosshair::after {
      content: '';
      position: absolute;
      background: var(--accent);
      opacity: 0.6;
    }
    .crosshair::before { width: 100%; height: 1px; top: 50%; }
    .crosshair::after { width: 1px; height: 100%; left: 50%; }

    .scan-line {
      position: absolute;
      width: 100%;
      height: 1px;
      background: var(--accent);
      box-shadow: 0 0 10px var(--accent-glow);
      top: 0;
      animation: scan 4s linear infinite;
      opacity: 0.3;
    }

    @keyframes scan {
      0% { top: 0; }
      100% { top: 100%; }
    }

    /* Side Panel */
    aside {
      grid-column: 2 / 3;
      grid-row: 2 / 4;
      background: var(--panel);
      border-left: 1px solid var(--line);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      overflow-y: auto;
    }

    h3 {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-dim);
      margin-bottom: 10px;
    }

    .data-grid {
      display: grid;
      gap: 12px;
    }

    .data-item {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      padding-bottom: 8px;
      border-bottom: 1px solid #222;
      font-family: var(--mono);
    }

    .data-item .label { color: var(--text-dim); }

    .result-card {
      background: #1a1a1a;
      padding: 12px;
      border-radius: 4px;
      border-left: 3px solid var(--accent);
      font-size: 14px;
      line-height: 1.5;
    }

    .tag-cloud {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
    }

    .tag {
      font-size: 10px;
      background: #333;
      padding: 2px 6px;
      border-radius: 3px;
      color: var(--text-dim);
    }

    /* Footer Controls */
    footer {
      grid-column: 1 / 2;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 40px;
      background: rgba(10, 10, 10, 0.8);
      border-top: 1px solid var(--line);
      z-index: 50;
    }

    .btn-circle {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: var(--accent);
      border: 4px solid var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.1s, background 0.2s;
      box-shadow: 0 0 15px var(--accent-glow);
    }

    .btn-circle:active {
      transform: scale(0.9);
      background: #2563eb;
    }

    .btn-inner-dot {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #fff;
    }

    .btn-secondary {
      color: var(--text-bright);
      background: transparent;
      border: 1px solid #444;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: 0.5px;
    }

    /* Result Drawer (for Mobile) */
    .result-drawer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--panel);
      border-radius: 20px 20px 0 0;
      padding: 20px;
      transform: translateY(100%);
      transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 100;
      max-height: 80vh;
      overflow-y: auto;
      border-top: 1px solid var(--line);
    }

    .result-drawer.open { transform: translateY(0); }

    .handle {
      width: 40px;
      height: 4px;
      background: var(--line);
      border-radius: 2px;
      margin: 0 auto 20px;
    }

    /* Loader UI in High Density */
    .loader {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      flex-direction: column;
      align-items: center;
      gap: 15px;
      background: rgba(0,0,0,0.8);
      padding: 30px;
      border-radius: 12px;
      border: 1px solid var(--accent);
      z-index: 1000;
    }
    .loader.active { display: flex; }

    .spinner {
      width: 32px;
      height: 32px;
      border: 2px solid var(--line);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .toast {
      position: fixed;
      bottom: 120px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--panel);
      border: 1px solid var(--line);
      color: var(--accent);
      padding: 8px 16px;
      border-radius: 4px;
      font-size: 11px;
      font-family: var(--mono);
      z-index: 1000;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .toast.show { opacity: 1; }

    #canvas { display: none; }
  </style>
</head>
<body>

  <div class="app-shell">
    <header>
      <div class="logo">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 2L4.5 20.29l.71.71L12 18l6.79 3 .71-.71z"/>
        </svg>
        FOOD CALORIE AI
      </div>
      <div class="status-bar">
        <div class="status-item">STATUS: <span id="api-status">ONLINE</span></div>
        <div class="status-item">ENGINE: <span>1.5 FLASH</span></div>
      </div>
    </header>

    <main>
      <video id="video" autoplay playsinline muted></video>
      <div class="scan-overlay">
        <div class="crosshair"></div>
        <div class="scan-line"></div>
      </div>
      <div id="toast" class="toast">準備好辨識食物</div>
      
      <!-- Hidden file input for camera/upload -->
      <input type="file" id="file-input" accept="image/*" capture="environment" style="display: none;">
    </main>

    <aside>
      <div>
        <h3>Nutrition Engine</h3>
        <div class="data-grid">
          <div class="data-item">
            <span class="label">Total Calories</span>
            <span class="value" id="total-cal-display">0 kcal</span>
          </div>
          <div class="data-item">
            <span class="label">Confidence</span>
            <span class="value" style="color: var(--success)">HIGH</span>
          </div>
        </div>
      </div>

      <div>
        <h3>Food Breakdown</h3>
        <div id="side-result-text" class="result-card">
          請拍攝或上傳一張食物照片開始辨識。
        </div>
        <div class="tag-cloud" id="tag-cloud">
        </div>
      </div>

      <div style="margin-top: auto;">
        <h3>System Logs</h3>
        <div style="font-family: var(--mono); font-size: 10px; color: var(--text-dim); line-height: 1.4;">
          [SYS] Engine version 1.5.0-flash<br>
          [SYS] Camera stream initialized<br>
          [SYS] Ready for inference
        </div>
      </div>
    </aside>

    <footer>
      <button class="btn-secondary" id="upload-trigger">上傳照片</button>
      <button class="btn-circle" id="capture-trigger" aria-label="拍照辨識">
        <div class="btn-inner-dot"></div>
      </button>
      <button class="btn-secondary">辨識紀錄</button>
    </footer>
  </div>

  <!-- Mobile Result Drawer -->
  <div class="result-drawer" id="result-drawer">
    <div class="handle"></div>
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
      <h3 style="margin: 0;">辨識結果 / Nutrition Info</h3>
      <button class="btn-secondary" id="close-drawer">CLOSE</button>
    </div>
    <div id="result-text" style="font-size: 14px; line-height: 1.6; color: var(--text-bright);">
      <!-- Content -->
    </div>
  </div>

  <div class="loader" id="loader">
    <div class="spinner"></div>
    <div style="font-family: var(--mono); font-size: 11px; margin-top: 10px; color: var(--accent);">正在計算熱量...</div>
  </div>

  <canvas id="canvas"></canvas>

  <script type="module">
    import { GoogleGenAI } from "@google/genai";

    const GEMINI_API_KEY = "AIzaSyDi0yRgZGwwwhh5-R1Yv2Om9ViJGkhr6g8";

    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const captureTrigger = document.getElementById('capture-trigger');
    const uploadTrigger = document.getElementById('upload-trigger');
    const fileInput = document.getElementById('file-input');
    const loader = document.getElementById('loader');
    const resultDrawer = document.getElementById('result-drawer');
    const resultText = document.getElementById('result-text');
    const sideResultText = document.getElementById('side-result-text');
    const closeDrawerBtn = document.getElementById('close-drawer');
    const toast = document.getElementById('toast');
    const apiStatus = document.getElementById('api-status');
    const tagCloud = document.getElementById('tag-cloud');
    const totalCalDisplay = document.getElementById('total-cal-display');

    // 初始化相機 (僅作為預覽背景)
    async function initCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment' },
          audio: false
        });
        video.srcObject = stream;
        showToast('相機預覽已就緒');
      } catch (err) {
        console.warn('Camera preview error:', err);
        showToast('無法預覽，但仍可上傳照片');
        apiStatus.innerText = 'OFFLINE';
        apiStatus.style.color = '#ff4444';
      }
    }

    function showToast(msg) {
      toast.innerText = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }

    // 處理圖片分析
    async function analyzeImage(base64Data) {
      if (!GEMINI_API_KEY) {
         const errorMsg = '錯誤：請設定 API Key。';
         resultText.innerHTML = `<p style="color: #ef4444;">${errorMsg}</p>`;
         sideResultText.innerHTML = errorMsg;
         resultDrawer.classList.add('open');
         return;
      }

      const genAI = new GoogleGenAI(GEMINI_API_KEY);
      const model = genAI.getGenerativeModel({ model: "gemini-1.5-flash" });

      try {
        loader.classList.add('active');
        captureTrigger.style.opacity = '0.5';
        captureTrigger.disabled = true;

        const prompt = "請分析這張照片中的食物，回傳 JSON 格式：{\"foods\": [{\"name\":\"食物名稱\",\"calories\":數字,\"protein\":數字,\"carbs\":數字,\"fat\":數字}], \"total_calories\": 數字}。請確保回傳內容僅包含 JSON 字串，方便解析。使用繁體中文。";
        
        const result = await model.generateContent([
          prompt,
          { inlineData: { data: base64Data, mimeType: 'image/jpeg' } }
        ]);

        const response = await result.response;
        const rawText = response.text();
        
        // 嘗試解析 JSON
        let data;
        try {
          const jsonMatch = rawText.match(/\{[\s\S]*\}/);
          data = JSON.parse(jsonMatch ? jsonMatch[0] : rawText);
        } catch (e) {
          console.error('JSON 解析失敗', e, rawText);
          data = { foods: [], total_calories: 0, error: '無法解析 JSON 格式，原始內容：' + rawText };
        }

        renderResult(data);
        
      } catch (err) {
        console.error('Gemini error:', err);
        const errorHtml = `<p style="color: #ef4444;">辨識失敗: ${err.message}</p>`;
        resultText.innerHTML = errorHtml;
        sideResultText.innerHTML = errorHtml;
        resultDrawer.classList.add('open');
      } finally {
        loader.classList.remove('active');
        captureTrigger.style.opacity = '1';
        captureTrigger.disabled = false;
      }
    }

    function renderResult(data) {
      if (data.error) {
        resultText.innerHTML = `<p>${data.error}</p>`;
        sideResultText.innerHTML = `<p>${data.error}</p>`;
        resultDrawer.classList.add('open');
        return;
      }

      totalCalDisplay.innerText = `${data.total_calories} kcal`;

      let html = `<div style="background: #222; padding: 15px; border-radius: 8px; border: 1px solid var(--line); margin-bottom: 20px;">
        <h2 style="color: var(--accent); margin-bottom: 15px;">總熱量: ${data.total_calories} kcal</h2>
        <table style="width: 100%; border-collapse: collapse; font-size: 13px;">
          <thead>
            <tr style="border-bottom: 1px solid var(--line); color: var(--text-dim);">
              <th style="padding: 10px; text-align: left;">品項</th>
              <th style="padding: 10px; text-align: right;">熱量</th>
              <th style="padding: 10px; text-align: right;">蛋白</th>
              <th style="padding: 10px; text-align: right;">脂肪</th>
            </tr>
          </thead>
          <tbody>`;

      data.foods.forEach(food => {
        html += `<tr style="border-bottom: 1px solid #333;">
          <td style="padding: 10px;">${food.name}</td>
          <td style="padding: 10px; text-align: right;">${food.calories}</td>
          <td style="padding: 10px; text-align: right;">${food.protein}g</td>
          <td style="padding: 10px; text-align: right;">${food.fat}g</td>
        </tr>`;
      });

      html += `</tbody></table></div>`;

      resultText.innerHTML = html;
      sideResultText.innerHTML = html;
      
      tagCloud.innerHTML = data.foods.slice(0, 5).map(f => `<span class="tag">#${f.name}</span>`).join('');
      
      if (window.innerWidth <= 768) {
        resultDrawer.classList.add('open');
      }
    }

    // 事件監聽
    captureTrigger.addEventListener('click', () => fileInput.click());
    uploadTrigger.addEventListener('click', () => fileInput.click());

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        const base64 = event.target.result.split(',')[1];
        analyzeImage(base64);
      };
      reader.readAsDataURL(file);
    });

    closeDrawerBtn.addEventListener('click', () => {
      resultDrawer.classList.remove('open');
    });

    // PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      });
    }

    initCamera();
  </script>
</body>
</html>
