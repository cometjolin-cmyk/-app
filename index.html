<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>AI 食物熱量辨識 PWA</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0c0d0f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap">
  <style>
    :root {
      --bg: #000000;
      --panel: rgba(22, 22, 22, 0.7);
      --accent: #3b82f6;
      --accent-glow: rgba(59, 130, 246, 0.5);
      --text-dim: #a1a1aa;
      --text-bright: #ffffff;
      --success: #22c55e;
      --line: rgba(255, 255, 255, 0.1);
      --glass-bg: rgba(20, 20, 20, 0.6);
      --glass-border: rgba(255, 255, 255, 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text-bright);
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Immersive Camera View */
    .viewport {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      background: #000;
    }

    #video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Glass Header */
    header {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      padding-top: env(safe-area-inset-top);
      background: linear-gradient(to bottom, rgba(0,0,0,0.8) 0%, transparent 100%);
      backdrop-filter: blur(4px);
      z-index: 50;
    }

    .logo {
      font-weight: 800;
      font-size: 16px;
      letter-spacing: 0.5px;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo svg {
      color: var(--accent);
      filter: drop-shadow(0 0 8px var(--accent-glow));
    }

    .status-bar {
      display: flex;
      gap: 8px;
    }

    .status-badge {
      font-size: 10px;
      padding: 4px 10px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 99px;
      color: #fff;
      font-weight: 600;
      backdrop-filter: blur(10px);
    }

    .status-badge span { color: var(--success); }

    /* Scan UI */
    .scan-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 10;
    }

    .target-frame {
      width: 240px;
      height: 240px;
      border: 2px solid rgba(255,255,255,0.2);
      border-radius: 24px;
      position: relative;
    }

    .target-frame::before {
      content: '';
      position: absolute;
      top: -2px;
      left: -2px;
      right: -2px;
      bottom: -2px;
      border: 2px solid var(--accent);
      border-radius: 24px;
      mask: linear-gradient(45deg, #000 20%, transparent 20%, transparent 80%, #000 80%),
            linear-gradient(-45deg, #000 20%, transparent 20%, transparent 80%, #000 80%);
      filter: drop-shadow(0 0 10px var(--accent-glow));
    }

    .scan-line {
      position: absolute;
      width: 100%;
      height: 2px;
      background: linear-gradient(to right, transparent, var(--accent), transparent);
      top: 0;
      animation: scan 3s ease-in-out infinite;
      opacity: 0.8;
    }

    @keyframes scan {
      0%, 100% { top: 0; }
      50% { top: 100%; }
    }

    /* Floating Dashboard (Footer) */
    .dashboard {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 24px;
      padding-bottom: calc(24px + env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      gap: 20px;
      background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, transparent 100%);
      z-index: 50;
    }

    .stats-row {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }

    .stats-card {
      flex: 1;
      min-width: 100px;
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      padding: 12px 16px;
      border-radius: 16px;
    }

    .stats-card .label {
      font-size: 10px;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    .stats-card .value {
      font-size: 16px;
      font-weight: 700;
      color: #fff;
    }

    .controls-row {
      display: flex;
      align-items: center;
      justify-content: space-around;
      gap: 20px;
    }

    .btn-action {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      backdrop-filter: blur(10px);
      cursor: pointer;
    }

    .shutter-btn {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: #fff;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      box-shadow: 0 0 30px rgba(255,255,255,0.3);
    }

    .shutter-btn:active {
      transform: scale(0.85);
    }

    .shutter-inner {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 2px solid #000;
      background: #fff;
    }

    /* Result Bottom Sheet */
    .bottom-sheet {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #141414;
      border-top: 1px solid rgba(255,255,255,0.1);
      border-radius: 32px 32px 0 0;
      padding: 0;
      transform: translateY(100%);
      transition: transform 0.5s cubic-bezier(0.19, 1, 0.22, 1);
      z-index: 100;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 -20px 40px rgba(0,0,0,0.5);
    }

    .bottom-sheet.open {
      transform: translateY(0);
    }

    .sheet-handle {
      width: 48px;
      height: 5px;
      background: rgba(255,255,255,0.2);
      border-radius: 99px;
      margin: 12px auto;
    }

    .sheet-content {
      padding: 24px;
      padding-top: 0;
      overflow-y: auto;
      flex: 1;
    }

    .sheet-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 24px;
    }

    .sheet-title {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .sheet-close {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(255,255,255,0.05);
      border: none;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Food Result Styling */
    .food-card {
      background: rgba(255,255,255,0.03);
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 20px;
      border: 1px solid rgba(255,255,255,0.05);
    }

    .food-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }

    .food-item:last-child { border-bottom: none; }

    .food-info {
      display: flex;
      flex-direction: column;
    }

    .food-name {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 2px;
    }

    .food-meta {
      font-size: 12px;
      color: var(--text-dim);
    }

    .food-cals {
      font-size: 16px;
      font-weight: 700;
      color: var(--accent);
    }

    /* Loader */
    .ai-loader {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(10px);
      z-index: 1000;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
    }

    .ai-loader.active { display: flex; }

    .pulse-ring {
      width: 80px;
      height: 80px;
      border: 2px solid var(--accent);
      border-radius: 50%;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.8); opacity: 0; }
      50% { opacity: 1; }
      100% { transform: scale(1.4); opacity: 0; }
    }

    .ai-status-text {
      font-size: 14px;
      font-weight: 600;
      color: var(--accent);
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .toast {
      position: fixed;
      top: 100px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(10px);
      padding: 10px 20px;
      border-radius: 99px;
      font-size: 12px;
      font-weight: 600;
      z-index: 1000;
      opacity: 0;
      transition: opacity 0.3s, transform 0.3s;
    }

    .toast.show { opacity: 1; transform: translateX(-50%) translateY(10px); }

    #canvas { display: none; }
  </style>
</head>
<body>

  <header>
    <div class="logo">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 2L4.5 20.29l.71.71L12 18l6.79 3 .71-.71z"/>
      </svg>
      CALORIE.AI
    </div>
    <div class="status-bar">
      <div class="status-badge">系統狀態: <span id="api-status">連線中</span></div>
    </div>
  </header>

  <div class="viewport">
    <video id="video" autoplay playsinline muted></video>
    <div id="camera-fallback" style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0c0d0f; z-index: -1;">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="1" style="margin-bottom: 16px; opacity: 0.5;">
        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2v11z"/>
        <circle cx="12" cy="13" r="4"/>
      </svg>
      <div style="font-size: 14px; color: var(--text-dim); letter-spacing: 1px;">請上傳相片開始分析</div>
    </div>
    <div class="scan-overlay">
      <div class="target-frame">
        <div class="scan-line"></div>
      </div>
    </div>
    <div id="toast" class="toast">準備好辨識食物</div>
  </div>

  <div class="dashboard">
    <div class="stats-row">
      <div class="stats-card">
        <div class="label">總熱量</div>
        <div class="value" id="total-cal-display">0 kcal</div>
      </div>
      <div class="stats-card">
        <div class="label">食物件數</div>
        <div class="value" id="item-count">0</div>
      </div>
      <div class="stats-card">
        <div class="label">AI 引擎</div>
        <div class="value">1.5F</div>
      </div>
    </div>

    <div class="controls-row">
      <button class="btn-action" id="upload-trigger" aria-label="Upload">
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1M16 8l-4-4-4 4M12 4v12"/>
        </svg>
      </button>
      
      <button class="shutter-btn" id="capture-trigger" aria-label="Snap">
        <div class="shutter-inner"></div>
      </button>

      <button class="btn-action" id="history-trigger" aria-label="History">
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
      </button>
    </div>

    <input type="file" id="file-input" accept="image/*" capture="environment" style="display: none;">
  </div>

  <!-- Bottom Sheet Results -->
  <div class="bottom-sheet" id="result-drawer">
    <div class="sheet-handle"></div>
    <div class="sheet-content">
      <div class="sheet-header">
        <div class="sheet-title">分析結果</div>
        <button class="sheet-close" id="close-drawer">✕</button>
      </div>
      <div id="result-text">
        <!-- Results will be injected here -->
      </div>
    </div>
  </div>

  <div class="ai-loader" id="loader">
    <div class="pulse-ring"></div>
    <div class="ai-status-text">正在分析餐點...</div>
  </div>

  <canvas id="canvas"></canvas>

</body>
</html>
